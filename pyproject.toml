[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sayodevice"
version = "0.9.1"
description = "Python library and CLI for controlling SayoDevice O3C via USB HID (API v2)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "hidapi>=0.14",
    "textual>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
sayodevice = "sayodevice.tui.app:run"

[tool.setuptools.packages.find]
include = ["sayodevice*"]
