[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sayo-fuckerr-apps"
version = "0.1.0"
description = "Applications for SayoDevice O3C — sequencer, stem control, and more"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "sayodevice",
]

[project.optional-dependencies]
midi = ["mido>=1.3.0", "python-rtmidi>=1.5.0"]

[project.scripts]
sequence-gate = "sequence_gate.__main__:main"

[tool.setuptools.packages.find]
include = ["sequence_gate*"]
